# Security Workflow - Supply Chain Security Lab
# This workflow runs security scans and signs the container image

name: Security Scans & Supply Chain Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t supply-chain-security-lab:latest -t supply-chain-security-lab:${{ github.sha }} -f app/Dockerfile app

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Run Trivy vulnerability & secret scan (filesystem)
        run: trivy fs --scanners vuln,secret,misconfig --severity CRITICAL,HIGH --exit-code 1 .

      - name: Run Trivy vulnerability scan (image)
        run: trivy image --severity CRITICAL,HIGH --exit-code 1 supply-chain-security-lab:latest

      - name: Generate SBOM (SPDX)
        run: trivy image --format spdx-json --output sbom.spdx.json supply-chain-security-lab:latest

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag supply-chain-security-lab:latest ghcr.io/${{ github.repository }}:latest
          docker tag supply-chain-security-lab:latest ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign container image (keyless OIDC)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}
          cosign sign --yes ghcr.io/${{ github.repository }}:latest

      - name: Verify container image signature
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "Verifying image signature..."
          cosign verify ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          echo "Image signature verified successfully!"
